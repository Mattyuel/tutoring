<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Inter, Arial, sans-serif" font-size="15">
  <rect width="640" height="340" fill="#ffffff"/>
  <defs>
    <pattern id="foam" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#ffffff"/>
      <circle cx="3" cy="3" r="2" fill="#333"/>
      <circle cx="9" cy="9" r="2" fill="#333"/>
    </pattern>
  </defs>
  <!-- Sun -->
  <g stroke="#1a1a1a" stroke-width="2.5">
    <line x1="60" y1="8" x2="60" y2="18"/><line x1="60" y1="82" x2="60" y2="92"/>
    <line x1="18" y1="50" x2="28" y2="50"/><line x1="92" y1="50" x2="102" y2="50"/>
    <line x1="30" y1="20" x2="37" y2="27"/><line x1="90" y1="20" x2="83" y2="27"/>
    <line x1="30" y1="80" x2="37" y2="73"/><line x1="90" y1="80" x2="83" y2="73"/>
  </g>
  <circle cx="60" cy="50" r="22" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="60" y="118" text-anchor="middle" font-weight="700">hot day</text>
  <text x="60" y="136" text-anchor="middle" font-weight="700">outside:</text>
  <text x="60" y="154" text-anchor="middle" font-weight="700">35 °C</text>
  <!-- lid -->
  <rect x="190" y="60" width="270" height="36" rx="6" fill="url(#foam)" stroke="#262626" stroke-width="7"/>
  <!-- body walls (foam) -->
  <path d="M190,104 L460,104 L460,290 Q460,300 450,300 L200,300 Q190,300 190,290 Z" fill="url(#foam)" stroke="#262626" stroke-width="7"/>
  <!-- inside space -->
  <rect x="220" y="104" width="210" height="166" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/>
  <!-- cans -->
  <g fill="#9a9a9a" stroke="#1a1a1a" stroke-width="2">
    <rect x="240" y="170" width="40" height="90" rx="4"/>
    <rect x="300" y="170" width="40" height="90" rx="4"/>
  </g>
  <!-- ice -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="356" y="226" width="30" height="30" rx="4" transform="rotate(8 371 241)"/>
    <rect x="390" y="222" width="28" height="28" rx="4" transform="rotate(-10 404 236)"/>
    <rect x="370" y="190" width="28" height="28" rx="4" transform="rotate(15 384 204)"/>
    <rect x="248" y="140" width="26" height="26" rx="4" transform="rotate(-8 261 153)"/>
  </g>
  <!-- labels -->
  <line x1="460" y1="78" x2="500" y2="70" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="75" font-weight="700">lid</text>
  <line x1="460" y1="130" x2="500" y2="130" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="126" font-weight="700">thick foam wall,</text>
  <text x="505" y="144">full of tiny</text>
  <text x="505" y="162">pockets of air</text>
  <line x1="460" y1="290" x2="500" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="298" font-weight="700">hard plastic</text>
  <text x="505" y="316">outside</text>
  <line x1="400" y1="215" x2="500" y2="215" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="220" font-weight="700">ice</text>
  <line x1="240" y1="215" x2="140" y2="230" stroke="#333" stroke-width="1.5"/>
  <text x="135" y="226" text-anchor="end" font-weight="700">cold</text>
  <text x="135" y="244" text-anchor="end" font-weight="700">drinks</text>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#333">An esky cut in half so you can see inside. Not to scale.</text>
</svg>
