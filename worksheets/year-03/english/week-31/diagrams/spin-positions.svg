<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Inter, Arial, sans-serif" font-size="16">
  <rect width="560" height="330" fill="#fff"/>
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6b5c"/></marker>
    <clipPath id="e"><circle cx="340" cy="160" r="100"/></clipPath>
  </defs>
  <circle cx="60" cy="160" r="50" fill="#fde047" stroke="#f59e0b" stroke-width="3"/>
  <text x="60" y="166" text-anchor="middle" font-weight="800">Sun</text>
  <g stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 6"><line x1="115" y1="110" x2="225" y2="110"/><line x1="115" y1="160" x2="225" y2="160"/><line x1="115" y1="210" x2="225" y2="210"/></g>
  <g clip-path="url(#e)"><rect x="240" y="60" width="100" height="200" fill="#bae6fd"/><rect x="340" y="60" width="100" height="200" fill="#1e3a8a"/></g>
  <circle cx="340" cy="160" r="100" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M430,52 A130,130 0 0 0 250,50" fill="none" stroke="#0f6b5c" stroke-width="3" marker-end="url(#s)"/>
  <text x="440" y="36" font-weight="700" fill="#0f6b5c" font-size="14">spins this way</text>
  <!-- people A (left, facing Sun), B (top), C (right), D (bottom) -->
  <g fill="#dc2626" stroke="#fff" stroke-width="2">
    <circle cx="240" cy="160" r="10"/><circle cx="340" cy="60" r="10"/><circle cx="440" cy="160" r="10"/><circle cx="340" cy="260" r="10"/>
  </g>
  <g font-weight="800" fill="#dc2626">
    <text x="214" y="166" text-anchor="end">A</text><text x="340" y="42" text-anchor="middle">B</text>
    <text x="458" y="166">C</text><text x="340" y="292" text-anchor="middle">D</text>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#64748b">Four children standing on the Earth (red dots). Looking down from above. Not to scale.</text>
</svg>
