<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="420" height="330" fill="#ffffff"/>
  <!-- compass -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="370" y1="70" x2="370" y2="30"/>
  </g>
  <polygon points="370,22 364,36 376,36" fill="#1a1a1a"/>
  <text x="370" y="88" text-anchor="middle" font-weight="800" fill="#1a1a1a">N</text>
  <text x="412" y="320" text-anchor="end" font-size="12" fill="#333333">not to scale</text>
  <!-- path: Start (60,290) -> E 3.2 (150,290) -> N 2.4 (150,236) -> E 1.8 (200,236) -> N 9.6 (200,40) Finish -->
  <polyline points="60,290 150,290 150,236 200,236 200,40" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#333333" stroke-width="1.3">
    <path d="M150,280 L140,280 L140,290"/>
    <path d="M150,246 L160,246 L160,236"/>
    <path d="M200,226 L190,226 L190,236"/>
  </g>
  <circle cx="60" cy="290" r="6" fill="#262626"/>
  <circle cx="200" cy="40" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <g fill="#1a1a1a" font-weight="700">
    <text x="105" y="310" text-anchor="middle">3.2 km</text>
    <text x="140" y="268" text-anchor="end">2.4 km</text>
    <text x="172" y="226" text-anchor="middle">1.8 km</text>
    <text x="210" y="145">9.6 km</text>
  </g>
  <g fill="#1a1a1a">
    <text x="52" y="276" text-anchor="middle">Start</text>
    <text x="212" y="34">Finish (lookout)</text>
  </g>
</svg>
