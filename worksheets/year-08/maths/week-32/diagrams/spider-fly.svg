<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="560" height="300" fill="#ffffff"/>
  <text x="552" y="20" text-anchor="end" font-size="12" fill="#333333">not to scale</text>
  <!-- front-bottom-left (40,250) front-top-left (40,118) back-top-left (110,68) back-bottom-left (110,200)
       right end: (370,250) (370,118) (440,68) (440,200) -->
  <polygon points="40,118 370,118 440,68 110,68" fill="#e6e6e6" stroke="none"/>
  <g stroke="#333333" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <line x1="40" y1="250" x2="110" y2="200"/>
    <line x1="110" y1="200" x2="440" y2="200"/>
    <line x1="110" y1="200" x2="110" y2="68"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <polygon points="40,250 370,250 370,118 40,118"/>
    <polyline points="370,250 440,200 440,68 370,118"/>
    <polyline points="40,118 110,68 440,68"/>
  </g>
  <!-- centre lines of end walls (thin dotted) -->
  <g stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="2 3">
    <line x1="75" y1="225" x2="75" y2="93"/>
    <line x1="405" y1="225" x2="405" y2="93"/>
  </g>
  <!-- spider S at (75,104); fly F at (405,214) -->
  <circle cx="75" cy="104" r="5.5" fill="#262626"/>
  <circle cx="405" cy="214" r="5.5" fill="#262626"/>
  <g font-weight="800" font-size="15" fill="#1a1a1a" stroke="#ffffff" stroke-width="3.5" paint-order="stroke">
    <text x="88" y="114">S</text>
    <text x="392" y="210" text-anchor="end">F</text>
  </g>
  <!-- dimensions -->
  <g font-weight="700" fill="#1a1a1a">
    <text x="205" y="270" text-anchor="middle">30 m</text>
    <text x="414" y="90">12 m</text>
    <text x="452" y="140">12 m</text>
  </g>
  <!-- callouts -->
  <line x1="70" y1="100" x2="30" y2="50" stroke="#333333" stroke-width="1"/>
  <text x="10" y="30" fill="#1a1a1a">S: spider, on the centre line of one end wall,</text>
  <text x="10" y="45" fill="#1a1a1a">1 m below the ceiling</text>
  <line x1="410" y1="220" x2="470" y2="262" stroke="#333333" stroke-width="1"/>
  <text x="550" y="278" text-anchor="end" fill="#1a1a1a">F: fly, on the centre line of the</text>
  <text x="550" y="293" text-anchor="end" fill="#1a1a1a">opposite end wall, 1 m above the floor</text>
</svg>
