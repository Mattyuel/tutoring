<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="720" height="290" fill="#ffffff"/>
  <g font-weight="800" font-size="15" fill="#1a1a1a">
    <text x="8" y="22">A</text><text x="262" y="22">B</text><text x="492" y="22">C</text>
  </g>
  <text x="712" y="20" text-anchor="end" font-size="12" fill="#333333">not to scale</text>

  <!-- A: roof truss. Wall tops (50,170),(230,170); ridge (140,110); overhang ends (26,186),(254,186) -->
  <rect x="44" y="170" width="12" height="70" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="224" y="170" width="12" height="70" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="50,170 140,110 230,170" fill="#e6e6e6" stroke="none"/>
  <line x1="50" y1="170" x2="230" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="140" y1="110" x2="140" y2="170" stroke="#333333" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M140,160 L150,160 L150,170" fill="none" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="110" x2="26" y2="186"/>
    <line x1="140" y1="110" x2="254" y2="186"/>
  </g>
  <text x="146" y="146" font-weight="700" fill="#1a1a1a">1.4 m</text>
  <text x="140" y="100" text-anchor="middle" fill="#333333">ridge</text>
  <!-- span dimension -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="50" y1="256" x2="230" y2="256"/>
    <line x1="50" y1="250" x2="50" y2="262"/><line x1="230" y1="250" x2="230" y2="262"/>
  </g>
  <text x="140" y="276" text-anchor="middle" font-weight="700" fill="#1a1a1a">span 9.6 m</text>
  <!-- overhang leader -->
  <line x1="34" y1="183" x2="70" y2="196" stroke="#333333" stroke-width="1"/>
  <text x="72" y="200" fill="#1a1a1a">overhang 0.6 m</text>
  <text x="72" y="215" fill="#1a1a1a">(along the slope)</text>
  <text x="62" y="128" fill="#1a1a1a" font-weight="700">rafter</text>

  <!-- B: TV screen 16:9 (170 x 96) -->
  <rect x="272" y="62" width="170" height="96" fill="#262626" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="272" y1="158" x2="442" y2="62" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="345" y="158" width="24" height="16" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="319" y="174" width="76" height="7" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="357" y="52" text-anchor="middle" font-weight="700" fill="#1a1a1a">width : height = 16 : 9</text>
  <g stroke="#333333" stroke-width="1.2">
    <line x1="272" y1="200" x2="442" y2="200"/><line x1="272" y1="194" x2="272" y2="206"/><line x1="442" y1="194" x2="442" y2="206"/>
    <line x1="456" y1="62" x2="456" y2="158"/><line x1="450" y1="62" x2="462" y2="62"/><line x1="450" y1="158" x2="462" y2="158"/>
  </g>
  <text x="357" y="220" text-anchor="middle" fill="#1a1a1a" font-weight="700">width</text>
  <text x="456" y="176" text-anchor="middle" fill="#1a1a1a" font-weight="700">height</text>
  <text x="357" y="246" text-anchor="middle" fill="#1a1a1a">screen size = length of</text>
  <text x="357" y="261" text-anchor="middle" fill="#1a1a1a">the dashed diagonal</text>

  <!-- C: toy kite. top (604,40), spar y=84 from 537 to 671, bottom (604,240) -->
  <polygon points="604,40 671,84 604,240 537,84" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <g stroke="#262626" stroke-width="3">
    <line x1="604" y1="40" x2="604" y2="240"/>
    <line x1="537" y1="84" x2="671" y2="84"/>
  </g>
  <path d="M604,94 L614,94 L614,84" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="642" y="104" text-anchor="middle" fill="#1a1a1a" font-weight="700">spar</text>
  <line x1="606" y1="190" x2="646" y2="196" stroke="#333333" stroke-width="1"/><text x="650" y="201" fill="#1a1a1a" font-weight="700">spine</text>
  <!-- dimensions -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="537" y1="262" x2="671" y2="262"/><line x1="537" y1="256" x2="537" y2="268"/><line x1="671" y1="256" x2="671" y2="268"/>
    <line x1="537" y1="88" x2="537" y2="268" stroke-dasharray="3 3"/><line x1="671" y1="88" x2="671" y2="268" stroke-dasharray="3 3"/>
    <line x1="696" y1="40" x2="696" y2="240"/><line x1="690" y1="40" x2="702" y2="40"/><line x1="690" y1="240" x2="702" y2="240"/>
    <line x1="520" y1="40" x2="520" y2="84"/><line x1="514" y1="40" x2="526" y2="40"/><line x1="514" y1="84" x2="526" y2="84"/>
    <line x1="608" y1="40" x2="526" y2="40" stroke-dasharray="3 3"/>
  </g>
  <text x="604" y="283" text-anchor="middle" fill="#1a1a1a" font-weight="700">60 cm</text>
  <text x="704" y="145" fill="#1a1a1a" font-weight="700" transform="rotate(90 704 145)" text-anchor="middle">90 cm</text>
  <text x="514" y="67" text-anchor="end" fill="#1a1a1a" font-weight="700">20 cm</text>
</svg>
