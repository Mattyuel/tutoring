<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Inter, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="sea" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffffff"/>
      <line x1="0" y1="5" x2="10" y2="5" stroke="#9a9a9a" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="780" height="330" fill="#ffffff"/>
  <text x="390" y="22" text-anchor="middle" font-weight="800" font-size="15" fill="#1a1a1a">Cross-section of North Beach, Tuart Bay (fictional; not to scale)</text>
  <!-- sea -->
  <polygon points="20,215 175,215 175,270 20,270" fill="url(#sea)" stroke="#333" stroke-width="1.5"/>
  <!-- waves -->
  <path d="M30 208 q10 -10 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#333" stroke-width="2"/>
  <!-- land profile -->
  <path d="M175 215 L270 195 L290 195 L290 130 L330 118 L420 118 L450 140 L500 170 L560 168 L600 150 L640 140 L760 140 L760 270 L175 270 Z" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
  <!-- old car park slab on foredune -->
  <rect x="300" y="108" width="115" height="10" fill="#262626"/>
  <!-- cars on old car park -->
  <g fill="#9a9a9a" stroke="#333" stroke-width="1"><rect x="315" y="96" width="30" height="12" rx="3"/><rect x="365" y="96" width="30" height="12" rx="3"/></g>
  <!-- broken edge chunks -->
  <polygon points="290,128 300,118 302,126" fill="#262626"/>
  <polygon points="282,196 292,190 296,196" fill="#262626"/>
  <!-- vegetation tufts (dune grasses) -->
  <g stroke="#1a1a1a" stroke-width="1.6" fill="none">
    <path d="M495 167 l-9 -10 M495 167 l-4 -15 M495 167 l0 -18 M495 167 l4 -15 M495 167 l9 -10"/>
    <path d="M545 169 l-9 -10 M545 169 l-4 -15 M545 169 l0 -18 M545 169 l4 -15 M545 169 l9 -10"/>
    <path d="M598 152 l-9 -10 M598 152 l-4 -15 M598 152 l0 -18 M598 152 l4 -15 M598 152 l9 -10"/>
    <path d="M458 145 l-9 -10 M458 145 l-4 -15 M458 145 l0 -18 M458 145 l4 -15 M458 145 l9 -10"/>
  </g>
  <!-- boardwalk -->
  <line x1="440" y1="128" x2="660" y2="128" stroke="#1a1a1a" stroke-width="4"/>
  <g stroke="#1a1a1a" stroke-width="2"><line x1="470" y1="128" x2="470" y2="146"/><line x1="520" y1="128" x2="520" y2="168"/><line x1="570" y1="128" x2="570" y2="160"/><line x1="620" y1="128" x2="620" y2="140"/></g>
  <!-- new car park inland -->
  <rect x="670" y="130" width="85" height="10" fill="#262626"/>
  <g fill="#9a9a9a" stroke="#333" stroke-width="1"><rect x="680" y="118" width="30" height="12" rx="3"/><rect x="718" y="118" width="30" height="12" rx="3"/></g>
  <!-- wind arrow -->
  <g stroke="#333" stroke-width="2" fill="#333">
    <line x1="200" y1="172" x2="272" y2="157"/><polygon points="282,155 268,150 270,163" stroke="none"/>
  </g>
  <text x="150" y="168" font-size="11.5" fill="#1a1a1a">wind-blown sand</text>
  <!-- labels -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="90" y1="238" x2="90" y2="292"/>
    <line x1="225" y1="208" x2="225" y2="292"/>
    <line x1="291" y1="160" x2="262" y2="292"/>
    <line x1="358" y1="96" x2="358" y2="62"/>
    <line x1="545" y1="128" x2="545" y2="62"/>
    <line x1="712" y1="118" x2="712" y2="62"/>
  </g>
  <g font-weight="800" font-size="15" text-anchor="middle" fill="#1a1a1a">
    <circle cx="90" cy="306" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="90" y="311">A</text>
    <circle cx="225" cy="306" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="225" y="311">B</text>
    <circle cx="262" cy="306" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="262" y="311">C</text>
    <circle cx="358" cy="48" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="358" y="53">D</text>
    <circle cx="545" cy="48" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="545" y="53">E</text>
    <circle cx="712" cy="48" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="712" y="53">F</text>
  </g>
  <text x="30" y="200" font-size="12" fill="#1a1a1a">sea</text>
  <text x="740" y="292" text-anchor="end" font-size="12" fill="#1a1a1a">inland →</text>
</svg>
