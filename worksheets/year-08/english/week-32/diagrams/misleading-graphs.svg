<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Inter, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a9a9a" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <!-- Graph 1 -->
  <text x="190" y="24" text-anchor="middle" font-weight="800" font-size="14" fill="#1a1a1a">Graph 1 (from the Shire's media release)</text>
  <text x="190" y="44" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Falls at the eroded dune edge</text>
  <!-- axis: y=300 is 0, y=90 is 3 ; 70 px per unit -->
  <g stroke="#333" stroke-width="2"><line x1="80" y1="80" x2="80" y2="300"/><line x1="80" y1="300" x2="320" y2="300"/></g>
  <g font-size="12" fill="#1a1a1a" text-anchor="end">
    <text x="72" y="304">0</text><text x="72" y="234">1</text><text x="72" y="164">2</text><text x="72" y="94">3</text>
  </g>
  <g stroke="#333" stroke-width="1.5"><line x1="76" y1="230" x2="80" y2="230"/><line x1="76" y1="160" x2="80" y2="160"/><line x1="76" y1="90" x2="80" y2="90"/></g>
  <rect x="115" y="230" width="70" height="70" fill="#262626"/>
  <rect x="215" y="90" width="70" height="210" fill="#262626"/>
  <g font-size="12.5" fill="#1a1a1a" text-anchor="middle"><text x="150" y="320">2024</text><text x="250" y="320">2025</text></g>
  <rect x="190" y="52" width="122" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="251" y="73" text-anchor="middle" font-weight="900" font-size="17" fill="#1a1a1a">UP 200%!</text>
  <text x="30" y="190" font-size="12" fill="#1a1a1a" transform="rotate(-90 30 190)" text-anchor="middle">number of falls</text>
  <!-- divider -->
  <line x1="380" y1="20" x2="380" y2="340" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Graph 2 -->
  <text x="570" y="24" text-anchor="middle" font-weight="800" font-size="14" fill="#1a1a1a">Graph 2 (from the Coastline Courier)</text>
  <text x="570" y="44" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Public submissions on the car park plan</text>
  <!-- axis 140..250 : y=300 is 140, 2 px per unit -> 240 at y=100 -->
  <g stroke="#333" stroke-width="2"><line x1="470" y1="70" x2="470" y2="300"/><line x1="470" y1="300" x2="710" y2="300"/></g>
  <g font-size="12" fill="#1a1a1a" text-anchor="end">
    <text x="462" y="304">140</text><text x="462" y="264">160</text><text x="462" y="224">180</text><text x="462" y="184">200</text><text x="462" y="144">220</text><text x="462" y="104">240</text>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <line x1="466" y1="260" x2="470" y2="260"/><line x1="466" y1="220" x2="470" y2="220"/><line x1="466" y1="180" x2="470" y2="180"/><line x1="466" y1="140" x2="470" y2="140"/><line x1="466" y1="100" x2="470" y2="100"/>
  </g>
  <rect x="505" y="100" width="70" height="200" fill="#262626"/>
  <rect x="605" y="276" width="70" height="24" fill="url(#hatch2)" stroke="#333" stroke-width="1.5"/>
  <g font-size="12.5" fill="#1a1a1a" text-anchor="middle"><text x="540" y="320">Opposed</text><text x="640" y="320">Supported</text></g>
  <text x="414" y="200" font-size="12" fill="#1a1a1a" transform="rotate(-90 414 200)" text-anchor="middle">number of submissions</text>
  <text x="380" y="352" text-anchor="middle" font-size="11.5" fill="#333">Both graphs are fictional. Data come from the Tuart Bay fact file.</text>
</svg>
