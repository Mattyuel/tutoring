<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Inter, Arial, sans-serif" font-size="13">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9a9a9a" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="22" text-anchor="middle" font-weight="800" font-size="15" fill="#1a1a1a">Front page mock-up: The Coastline Courier (fictional), Wednesday</text>
  <!-- page -->
  <rect x="150" y="36" width="460" height="420" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <!-- masthead -->
  <rect x="150" y="36" width="460" height="46" fill="#262626"/>
  <text x="380" y="66" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="20" font-family="Georgia, serif">THE COASTLINE COURIER</text>
  <!-- story A -->
  <text x="166" y="112" font-weight="900" font-size="26" fill="#1a1a1a">BEACH PARKING AXED</text>
  <rect x="166" y="124" width="300" height="140" fill="url(#hatch)" stroke="#333" stroke-width="1.5"/>
  <rect x="246" y="182" width="140" height="24" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="316" y="199" text-anchor="middle" font-size="12" fill="#1a1a1a">large photo</text>
  <g stroke="#9a9a9a" stroke-width="3">
    <line x1="166" y1="280" x2="466" y2="280"/><line x1="166" y1="292" x2="466" y2="292"/><line x1="166" y1="304" x2="420" y2="304"/>
  </g>
  <!-- story B (right column) -->
  <text x="482" y="104" font-weight="700" font-size="13" fill="#1a1a1a">Netball: Tuart Bay</text>
  <text x="482" y="120" font-weight="700" font-size="13" fill="#1a1a1a">into grand final</text>
  <rect x="482" y="130" width="112" height="60" fill="#e6e6e6" stroke="#333" stroke-width="1"/>
  <text x="538" y="164" text-anchor="middle" font-size="11" fill="#1a1a1a">small photo</text>
  <g stroke="#9a9a9a" stroke-width="3">
    <line x1="482" y1="204" x2="594" y2="204"/><line x1="482" y1="216" x2="594" y2="216"/><line x1="482" y1="228" x2="560" y2="228"/>
  </g>
  <!-- fold line -->
  <line x1="150" y1="330" x2="610" y2="330" stroke="#333" stroke-width="1.5" stroke-dasharray="8 5"/>
  <!-- story C -->
  <text x="166" y="356" font-weight="700" font-size="14" fill="#1a1a1a">Bushfire season: is your plan ready?</text>
  <g stroke="#9a9a9a" stroke-width="3">
    <line x1="166" y1="372" x2="440" y2="372"/><line x1="166" y1="384" x2="440" y2="384"/><line x1="166" y1="396" x2="400" y2="396"/>
  </g>
  <!-- story D -->
  <rect x="470" y="404" width="128" height="40" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="534" y="420" text-anchor="middle" font-size="11" fill="#1a1a1a">Shire responds:</text>
  <text x="534" y="435" text-anchor="middle" font-size="11" fill="#1a1a1a">see page 9</text>
  <!-- letter labels with leader lines -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="166" y1="104" x2="122" y2="104"/>
    <line x1="594" y1="112" x2="640" y2="112"/>
    <line x1="166" y1="352" x2="122" y2="352"/>
    <line x1="598" y1="424" x2="640" y2="424"/>
    <line x1="150" y1="330" x2="122" y2="300"/>
  </g>
  <g font-weight="800" font-size="15" text-anchor="middle" fill="#1a1a1a">
    <circle cx="108" cy="104" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="108" y="109">A</text>
    <circle cx="654" cy="112" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="654" y="117">B</text>
    <circle cx="108" cy="352" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="108" y="357">C</text>
    <circle cx="654" cy="424" r="13" fill="#ffffff" stroke="#333" stroke-width="2"/><text x="654" y="429">D</text>
  </g>
  <text x="112" y="292" text-anchor="end" font-size="12" fill="#1a1a1a">fold</text>
</svg>
