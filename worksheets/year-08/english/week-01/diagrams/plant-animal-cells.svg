<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="820" height="290" fill="#ffffff"/>
  <text x="235" y="24" text-anchor="middle" font-weight="800" font-size="15" fill="#464646">Animal cell</text>
  <text x="560" y="24" text-anchor="middle" font-weight="800" font-size="15" fill="#464646">Plant cell</text>
  <!-- Animal cell -->
  <ellipse cx="235" cy="155" rx="112" ry="88" fill="#f5f5f5" stroke="#404040" stroke-width="2.5"/>
  <circle cx="250" cy="150" r="30" fill="#dadada" stroke="#434343" stroke-width="2"/>
  <circle cx="255" cy="145" r="8" fill="#434343"/>
  <g fill="#dcdcdc" stroke="#595959" stroke-width="1.5"><ellipse cx="180" cy="200" rx="18" ry="9"/><ellipse cx="300" cy="105" rx="16" ry="8"/></g>
  <!-- Plant cell -->
  <rect x="440" y="45" width="242" height="210" rx="6" fill="#f4f4f4" stroke="#515151" stroke-width="7"/>
  <rect x="449" y="54" width="224" height="192" rx="4" fill="none" stroke="#404040" stroke-width="1.8"/>
  <rect x="470" y="90" width="150" height="110" rx="30" fill="#efefef" stroke="#575757" stroke-width="2"/>
  <circle cx="645" cy="222" r="15" fill="#dadada" stroke="#434343" stroke-width="2"/>
  <g fill="#b8b8b8" stroke="#515151" stroke-width="1.5"><ellipse cx="648" cy="150" rx="8" ry="14"/><ellipse cx="490" cy="70" rx="14" ry="8"/><ellipse cx="500" cy="225" rx="14" ry="8"/><ellipse cx="460" cy="150" rx="6" ry="13"/></g>
  <ellipse cx="640" cy="82" rx="14" ry="7" fill="#dcdcdc" stroke="#595959" stroke-width="1.5"/>
  <!-- leader lines -->
  <g stroke="#727272" stroke-width="1">
    <line x1="100" y1="70" x2="245" y2="140"/><line x1="100" y1="115" x2="200" y2="125"/><line x1="100" y1="160" x2="124" y2="160"/><line x1="100" y1="230" x2="170" y2="205"/>
    <line x1="686" y1="55" x2="700" y2="55"/><line x1="654" y1="82" x2="700" y2="82"/><line x1="673" y1="115" x2="700" y2="115"/><line x1="656" y1="150" x2="700" y2="150"/><line x1="610" y1="185" x2="700" y2="185"/><line x1="660" y1="222" x2="700" y2="222"/>
  </g>
  <g fill="#232323">
    <text x="10" y="74">nucleus</text><text x="10" y="119">cytoplasm</text><text x="10" y="164">cell membrane</text><text x="10" y="234">mitochondrion</text>
    <text x="705" y="59">cell wall</text><text x="705" y="86">mitochondrion</text><text x="705" y="119">cell membrane</text><text x="705" y="154">chloroplast</text><text x="705" y="189">vacuole</text><text x="705" y="226">nucleus</text>
  </g>
  <text x="390" y="282" text-anchor="middle" font-size="11" fill="#464646">Simplified diagrams, not to scale. Both cells also contain cytoplasm and many more structures.</text>
</svg>
