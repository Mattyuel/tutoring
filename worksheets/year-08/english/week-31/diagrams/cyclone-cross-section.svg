<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="780" height="340" fill="#fff"/>
  <text x="390" y="22" text-anchor="middle" font-weight="800" font-size="15" fill="#0f6b5c">Cross-section through a tropical cyclone (simplified)</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <!-- sea -->
  <rect x="80" y="262" width="620" height="34" fill="#dbeafe"/>
  <path d="M80,262 q15,-6 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t20,0" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <!-- outer rainbands -->
  <path d="M110,262 C110,220 135,205 160,215 C175,195 205,205 205,262 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <path d="M575,262 C575,205 605,195 620,215 C645,205 670,220 670,262 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <!-- eyewall towers -->
  <path d="M235,262 C232,170 250,95 300,80 C330,72 350,90 362,120 L366,262 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <path d="M414,262 L418,120 C430,90 450,72 480,80 C530,95 548,170 545,262 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- anvil / top cloud -->
  <path d="M180,92 C220,62 300,55 362,70 L418,70 C480,55 560,62 600,92 C560,86 520,88 480,80 L300,80 C260,88 220,86 180,92 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <!-- low-level inflow arrows -->
  <line x1="100" y1="250" x2="225" y2="250" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="680" y1="250" x2="555" y2="250" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- rising in eyewall -->
  <line x1="300" y1="235" x2="300" y2="110" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="480" y1="235" x2="480" y2="110" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- outflow -->
  <line x1="330" y1="66" x2="200" y2="66" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="450" y1="66" x2="580" y2="66" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- sinking in eye -->
  <line x1="390" y1="100" x2="390" y2="225" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ab)"/>
  <!-- letter labels with leader lines -->
  <g stroke="#64748b" stroke-width="1">
    <line x1="390" y1="240" x2="390" y2="300"/>
    <line x1="520" y1="160" x2="740" y2="160"/>
    <line x1="640" y1="225" x2="740" y2="225"/>
    <line x1="120" y1="250" x2="40" y2="200"/>
    <line x1="210" y1="66" x2="40" y2="66"/>
  </g>
  <g font-weight="800" font-size="15" fill="#0f6b5c">
    <text x="384" y="316">A</text>
    <text x="746" y="165">B</text>
    <text x="746" y="230">C</text>
    <text x="26" y="205">D</text>
    <text x="26" y="71">E</text>
  </g>
  <text x="710" y="285" font-size="12" fill="#1e3a8a" text-anchor="end">ocean surface</text>
  <text x="390" y="334" font-size="11" fill="#64748b" text-anchor="middle">Not to scale: a cyclone can be hundreds of km wide but only about 15 km tall.</text>
</svg>
