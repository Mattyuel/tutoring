<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="700" height="220" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9a9a9a" stroke-width="1.5"/></pattern>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#e6e6e6"/><circle cx="2.5" cy="2.5" r="0.9" fill="#333"/></pattern>
  </defs>
  <!-- panel frames -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="10" y="10" width="118" height="190" rx="8"/>
    <rect x="148" y="10" width="118" height="190" rx="8"/>
    <rect x="286" y="10" width="118" height="190" rx="8"/>
    <rect x="424" y="10" width="118" height="190" rx="8"/>
    <rect x="562" y="10" width="118" height="190" rx="8"/>
  </g>
  <g font-weight="800" font-size="16" fill="#1a1a1a">
    <text x="20" y="32">A</text><text x="158" y="32">B</text><text x="296" y="32">C</text><text x="434" y="32">D</text><text x="572" y="32">E</text>
  </g>
  <!-- arrows -->
  <g stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="130" y1="105" x2="144" y2="105"/><line x1="268" y1="105" x2="282" y2="105"/>
    <line x1="406" y1="105" x2="420" y2="105"/><line x1="544" y1="105" x2="558" y2="105"/>
  </g>

  <!-- A: wattle branch with flowers and hanging pods -->
  <path d="M22,62 C55,58 85,64 118,52" fill="none" stroke="#333" stroke-width="3"/>
  <g fill="#e6e6e6" stroke="#333" stroke-width="1.2">
    <ellipse cx="45" cy="50" rx="14" ry="4" transform="rotate(-25 45 50)"/>
    <ellipse cx="96" cy="46" rx="14" ry="4" transform="rotate(-35 96 46)"/>
  </g>
  <g fill="#ffffff" stroke="#333" stroke-width="1.2" stroke-dasharray="2 1.5">
    <circle cx="66" cy="48" r="6"/><circle cx="110" cy="40" r="5"/>
  </g>
  <g fill="#262626">
    <path d="M38,61 C34,90 40,118 50,142 C54,140 50,112 44,61 Z"/>
    <path d="M62,62 C60,95 66,125 78,150 C83,148 76,118 69,61 Z"/>
    <path d="M90,59 C88,88 94,112 104,132 C108,130 103,105 97,58 Z"/>
  </g>
  <!-- B: split pod, seeds falling into a wooden dish -->
  <path d="M168,58 C190,48 215,52 245,44" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M168,58 C190,72 215,68 245,44" fill="none" stroke="#333" stroke-width="2"/>
  <g fill="#262626">
    <ellipse cx="190" cy="92" rx="4" ry="3"/><ellipse cx="208" cy="104" rx="4" ry="3"/>
    <ellipse cx="222" cy="86" rx="4" ry="3"/><ellipse cx="199" cy="120" rx="4" ry="3"/>
    <ellipse cx="185" cy="150" rx="4" ry="3"/><ellipse cx="195" cy="152" rx="4" ry="3"/><ellipse cx="205" cy="149" rx="4" ry="3"/>
    <ellipse cx="215" cy="152" rx="4" ry="3"/><ellipse cx="225" cy="150" rx="4" ry="3"/><ellipse cx="200" cy="145" rx="4" ry="3"/><ellipse cx="212" cy="144" rx="4" ry="3"/>
  </g>
  <path d="M162,150 C175,180 240,180 252,150 Z" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="2"/>
