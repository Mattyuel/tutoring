  <path d="M436,160 C434,140 450,134 484,134 C516,134 532,140 530,160 Z" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/>
  <ellipse cx="478" cy="124" rx="22" ry="11" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="2"/>
  <g fill="#262626"><ellipse cx="448" cy="133" rx="3" ry="2"/><ellipse cx="456" cy="131" rx="3" ry="2"/></g>
  <g fill="#333"><circle cx="505" cy="131" r="1"/><circle cx="510" cy="132" r="1"/><circle cx="514" cy="131" r="1"/><circle cx="508" cy="129" r="1"/><circle cx="518" cy="132" r="1"/></g>
  <line x1="450" y1="98" x2="506" y2="98" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <!-- E: bowl of fine powder -->
  <path d="M586,140 C600,112 642,112 656,140 Z" fill="url(#dots)" stroke="#333" stroke-width="1.5"/>
  <path d="M576,140 C584,176 658,176 666,140 Z" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="2"/>
