  <g fill="none" stroke="#333" stroke-width="2" stroke-linecap="round">
    <path d="M318,70 C312,62 324,56 318,48"/><path d="M345,74 C339,66 351,60 345,52"/><path d="M372,70 C366,62 378,56 372,48"/>
  </g>
  <g fill="#262626" stroke="#1a1a1a">
    <path d="M300,170 C298,150 318,146 326,156 C332,140 356,140 360,154 C368,142 392,150 390,170 Z"/>
  </g>
  <g fill="url(#hatch)" stroke="#333" stroke-width="1.2">
    <ellipse cx="320" cy="150" rx="5" ry="3.5"/><ellipse cx="333" cy="143" rx="5" ry="3.5"/><ellipse cx="347" cy="140" rx="5" ry="3.5"/>
    <ellipse cx="361" cy="146" rx="5" ry="3.5"/><ellipse cx="374" cy="151" rx="5" ry="3.5"/>
  </g>
  <line x1="296" y1="172" x2="394" y2="172" stroke="#333" stroke-width="2"/>
