<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="Inter, Arial, sans-serif" font-size="14">
  <rect width="680" height="260" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#9a9a9a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#333" stroke-width="1.2"/></pattern>
  </defs>
  <!-- ground -->
  <line x1="40" y1="215" x2="640" y2="215" stroke="#333" stroke-width="2"/>
  <!-- lower stone Q: large flat slab with a shallow dip -->
  <path d="M120,213 C110,190 118,168 150,162 C220,174 380,178 470,164 C510,160 532,180 528,213 Z" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- seeds R on the left of the slab -->
  <g fill="#262626">
    <ellipse cx="170" cy="164" rx="5" ry="3.5"/><ellipse cx="182" cy="166" rx="5" ry="3.5"/><ellipse cx="194" cy="167" rx="5" ry="3.5"/>
    <ellipse cx="176" cy="159" rx="5" ry="3.5"/><ellipse cx="189" cy="161" rx="5" ry="3.5"/><ellipse cx="206" cy="168" rx="5" ry="3.5"/>
  </g>
  <!-- upper hand stone P -->
  <ellipse cx="320" cy="150" rx="62" ry="26" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- powder S on the right -->
  <path d="M410,172 C420,160 440,158 452,166 L456,168 Z" fill="#9a9a9a"/>
  <g fill="#333">
    <circle cx="404" cy="171" r="1.4"/><circle cx="412" cy="169" r="1.4"/><circle cx="420" cy="166" r="1.4"/><circle cx="428" cy="165" r="1.4"/>
    <circle cx="436" cy="164" r="1.4"/><circle cx="444" cy="165" r="1.4"/><circle cx="450" cy="167" r="1.4"/><circle cx="416" cy="172" r="1.4"/>
    <circle cx="426" cy="169" r="1.4"/><circle cx="434" cy="168" r="1.4"/><circle cx="442" cy="169" r="1.4"/><circle cx="462" cy="166" r="1.4"/>
  </g>
  <!-- movement arrow -->
  <line x1="250" y1="98" x2="390" y2="98" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <!-- labels -->
  <g font-weight="800" font-size="16" fill="#1a1a1a">
    <text x="300" y="40">P</text><text x="580" y="200">Q</text><text x="90" y="120">R</text><text x="560" y="130">S</text>
  </g>
  <g stroke="#333" stroke-width="1.4">
    <line x1="306" y1="46" x2="304" y2="92"/>
    <line x1="304" y1="104" x2="306" y2="126"/>
    <line x1="576" y1="196" x2="510" y2="196"/>
    <line x1="104" y1="122" x2="168" y2="156"/>
    <line x1="556" y1="134" x2="458" y2="162"/>
  </g>
  <text x="640" y="248" text-anchor="end" font-size="12" font-style="italic" fill="#333">simplified side view, not to scale</text>
</svg>
