<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="Inter, Arial, sans-serif" font-size="13">
  <rect width="680" height="290" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#232323"/></marker>
    <g id="steel"><rect x="0" y="0" width="20" height="30" rx="2" fill="#727272" stroke="#404040"/><ellipse cx="10" cy="1" rx="10" ry="3" fill="#a2a2a2" stroke="#404040"/><line x1="0" y1="10" x2="20" y2="10" stroke="#404040"/><line x1="0" y1="20" x2="20" y2="20" stroke="#404040"/></g>
    <g id="alu"><rect x="0" y="0" width="20" height="30" rx="2" fill="#f4f4f4" stroke="#727272"/><ellipse cx="10" cy="1" rx="10" ry="3" fill="#e7e7e7" stroke="#727272"/><rect x="0" y="11" width="20" height="8" fill="#a5a5a5"/></g>
  </defs>
  <!-- key -->
  <rect x="20" y="12" width="250" height="44" rx="6" fill="#ffffff" stroke="#d4d4d4"/>
  <use href="#steel" x="32" y="19" transform="translate(0,0) scale(1)"/>
  <text x="60" y="39" fill="#232323">steel can</text>
  <use href="#alu" x="150" y="19"/>
  <text x="178" y="39" fill="#232323">aluminium can</text>
  <!-- conveyor -->
  <rect x="60" y="150" width="390" height="20" rx="10" fill="#d5d5d5" stroke="#404040" stroke-width="2"/>
  <circle cx="72" cy="160" r="9" fill="#a2a2a2" stroke="#404040" stroke-width="1.5"/>
  <circle cx="438" cy="160" r="22" fill="#565656" stroke="#3d3d3d" stroke-width="2"/>
  <circle cx="438" cy="160" r="4" fill="#ffffff"/>
  <!-- cans: 12 cans, aluminium at positions 3, 7, 10 -->
  <use href="#steel" x="80" y="119"/>
  <use href="#steel" x="108" y="119"/>
  <use href="#alu" x="136" y="119"/>
  <use href="#steel" x="164" y="119"/>
  <use href="#steel" x="192" y="119"/>
  <use href="#steel" x="220" y="119"/>
  <use href="#alu" x="248" y="119"/>
  <use href="#steel" x="276" y="119"/>
  <use href="#steel" x="304" y="119"/>
  <use href="#alu" x="332" y="119"/>
  <use href="#steel" x="360" y="119"/>
  <use href="#steel" x="388" y="119"/>
  <!-- belt direction -->
  <line x1="160" y1="192" x2="300" y2="192" stroke="#232323" stroke-width="2" marker-end="url(#ar)"/>
  <text x="160" y="212" fill="#232323">belt moves this way</text>
  <!-- roller label -->
  <text x="470" y="90" fill="#464646" font-weight="700">magnetic roller</text>
  <text x="470" y="106" fill="#464646">(a strong magnet)</text>
  <line x1="490" y1="110" x2="452" y2="144" stroke="#565656" stroke-width="1.5"/>
  <!-- bins -->
  <path d="M400,215 L408,270 L462,270 L470,215 Z" fill="#f2f2f2" stroke="#626262" stroke-width="2"/>
  <path d="M540,215 L548,270 L612,270 L620,215 Z" fill="#f2f2f2" stroke="#626262" stroke-width="2"/>
  <text x="340" y="250" fill="#464646" font-weight="700">Bin A</text>
  <line x1="380" y1="246" x2="402" y2="240" stroke="#626262"/>
  <text x="630" y="250" fill="#464646" font-weight="700">Bin B</text>
  <line x1="628" y1="246" x2="616" y2="240" stroke="#626262"/>
  <text x="660" y="284" text-anchor="end" fill="#464646" font-size="12" font-style="italic">simplified, not to scale</text>
</svg>
